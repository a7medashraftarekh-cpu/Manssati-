<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب | أكاديميتي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<section class="container-sm" style="padding:60px 16px;">
  <div class="card">
    <h1 style="text-align:center;color:var(--brand-900);margin-bottom:24px;">إنشاء حساب جديد</h1>
    <form id="register-form">
      <div class="field"><label>الاسم الكامل</label><input type="text" id="name" required></div>
      <div class="field"><label>البريد الإلكتروني</label><input type="email" id="email" required></div>
      <div class="field"><label>كلمة المرور</label><input type="password" id="password" minlength="8" required></div>
      <p class="text-danger" id="error-msg" style="display:none;font-size:14px;"></p>
      <button type="submit" class="btn btn-gold btn-block" id="submit-btn">إنشاء الحساب</button>
    </form>
    <p class="text-center text-muted" style="font-size:14px;margin-top:16px;">
      لديك حساب؟ <a href="login.html" style="color:var(--brand-800);font-weight:700;">سجّل الدخول</a>
    </p>
  </div>
</section>
<script type="module" src="register.js?v=2"></script>
</body>
</html>
