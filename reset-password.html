<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعيين كلمة مرور جديدة | أكاديميتي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<section class="container-sm" style="padding:60px 16px;">
  <div class="card" id="card">
    <h1 style="text-align:center;color:var(--brand-900);margin-bottom:24px;">تعيين كلمة مرور جديدة</h1>
    <form id="reset-form">
      <div class="field"><label>كلمة المرور الجديدة</label><input type="password" id="password" minlength="8" required></div>
      <p class="text-danger" id="error-msg" style="display:none;font-size:14px;"></p>
      <button type="submit" class="btn btn-gold btn-block" id="submit-btn">حفظ كلمة المرور</button>
    </form>
    <p id="success-msg" class="text-center text-success" style="display:none;font-size:14px;"></p>
  </div>
</section>
<script type="module" src="reset-password.js"></script>
</body>
</html>
