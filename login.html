<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | أكاديميتي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<section class="container-sm" style="padding:60px 16px;">
  <div class="card">
    <h1 style="text-align:center;color:var(--brand-900);margin-bottom:24px;">تسجيل الدخول</h1>
    <form id="login-form">
      <div class="field"><label>البريد الإلكتروني</label><input type="email" id="email" required></div>
      <div class="field">
        <div style="display:flex;justify-content:space-between;">
          <label>كلمة المرور</label>
          <a href="forgot-password.html" style="font-size:12px;color:var(--brand-700);">نسيت كلمة المرور؟</a>
        </div>
        <input type="password" id="password" required>
      </div>
      <p class="text-danger" id="error-msg" style="display:none;font-size:14px;"></p>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">دخول</button>
    </form>
    <p class="text-center text-muted" style="font-size:14px;margin-top:16px;">
      ليس لديك حساب؟ <a href="register.html" style="color:var(--brand-800);font-weight:700;">أنشئ حسابًا</a>
    </p>
  </div>
</section>
<script type="module" src="login.js?v=2"></script>
</body>
</html>
