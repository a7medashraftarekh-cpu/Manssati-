<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استعادة كلمة المرور | أكاديميتي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<section class="container-sm" style="padding:60px 16px;">
  <div class="card">
    <h1 style="text-align:center;color:var(--brand-900);margin-bottom:24px;">استعادة كلمة المرور</h1>
    <div id="form-wrap">
      <form id="forgot-form">
        <div class="field"><label>البريد الإلكتروني</label><input type="email" id="email" required></div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">إرسال رابط الاستعادة</button>
      </form>
    </div>
    <p id="success-msg" class="text-center" style="display:none;font-size:14px;"></p>
    <p class="text-center text-muted" style="font-size:14px;margin-top:16px;">
      تذكرت كلمة المرور؟ <a href="login.html" style="color:var(--brand-800);font-weight:700;">سجّل الدخول</a>
    </p>
  </div>
</section>
<script type="module" src="forgot-password.js?v=2"></script>
</body>
</html>
